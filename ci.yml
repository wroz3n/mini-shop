name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Установить зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Линтер
        run: ruff check app tests
      - name: Тесты с покрытием
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Проверка, что приложение стартует
        run: python -c "from app.main import create_app; create_app()"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Собрать архив проекта
        run: |
          tar --exclude=app.db --exclude=__pycache__ --exclude=.venv --exclude=.git \
            -czf /tmp/mini-shop.tar.gz .
      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: mini-shop
          path: /tmp/mini-shop.tar.gz
